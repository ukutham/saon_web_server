<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" type="text/css" href="/static/base.css">
	<link rel="stylesheet" type="text/css" href="/static/password_forgot/password_forgot.css">
	<title>SAON, mot de passe oublié</title>

	<meta name ="robots" content ="noindex, nofollow">
</head>
{% extends 'header_footer/header_footer.html' %}
<body>
	{% block content %}
	<div style="height: 50vh;">
		<div id="back_to_the_account_page">
			<a href="../?page=account">
				<svg
			    fill="none"
			    stroke="#000"
			    viewBox=' 0 0 600 600'
			    height='70px'
			    width='70px'>
					<path stroke-width="40" stroke-linecap="round" stroke-linejoin="round" d="M 300 450 L 100 300 L 300 150 L 100 300 L 550 300 L 100 300 z"/>
				</svg>
			</a>
		</div>
		<div id='password_forgot_container'>
			<div id='container_mail_address'>
				<form action="../../password_forgot" method="post">
					<div id="title">Mot de passe oublié</div>
					<label for="enter_mail_address">veuilliez indiquer l'adresse mail de votre compte</label>
					<div id='error'>{{ error }}</div>
					<div class="gradient_border" style="border-radius: 10px;">
						<input type="text" name="email" id='enter_mail_address' placeholder="email">
					</div>
					<div class="gradient_border" style="border-radius: 10px; margin-top: 10px; margin-left: auto;">
						<input type="submit" value="valider" id='mail_submit'>
					</div>
				</form>
			</div>
		</div>
	</div>
	{% endblock %}
</body>
</html>
