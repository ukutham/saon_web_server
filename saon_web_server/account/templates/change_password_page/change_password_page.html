{% load static %}

<!DOCTYPE html>
<html>
<head>
	<style type="text/css">
		@font-face {
		    font-family: 'Montserrat';
		    src: url("{% static 'fonts/Montserrat/Montserrat-VariableFont_wght.ttf' %}");
		    font-weight: normal;
		    font-style: normal;
		}
	</style>
	
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" type="text/css" href="{% static 'validation_page/validation_page.css' %}">
	<link rel="stylesheet" type="text/css" href="{% static 'base.css' %}">
	<script type="text/javascript" src="{% static 'base.js' %}"></script>
	<link rel="icon" type='image/png' href="{% static 'logo/logo_savon_v2.png' %}">
	<title>Saon</title>

	<meta name ="robots" content ="noindex, nofollow">
</head>
<body>
	<style type="text/css">
		input {
			outline: none;
			border: none;
			border-radius: 10px;
			padding: 10px;
		}

		input[type='text'] {
			width: 300px;
		}

		input[type='submit'] {
			background: white;
			cursor: pointer;
		}

		h1 {
			font-size: 2em;
			text-align: center;
		}

		@media (max-width: 700px) {
			h1 {
				font-size: 1.3em;
			}
		}

		.gradient_border {
			border-radius: 10px;
			margin-top: 5px;
			margin-bottom: 5px;
		}

		#error {
			font-size: 0.75em;
			color: red;
		}
	</style>

	<div id="accept_message">
		<div id='saon_icon'>
			<img src="{% static 'logo/logo_savon_v2.png' %}">
		</div>
		<div style="display: flex; flex-direction: column; margin-inline: 10px">
			<h1 style="margin-bottom: 20px;">Veuillez saisir votre nouveau mot de passe :</h1>
			<span id="error"></span>
			<div class="gradient_border" id="password_input">
				<input type="text" placeholder="mot de passe">
			</div>
			<div class="gradient_border" id="password_confirm_input">
				<input type="text" placeholder="confirmer votre mot de passe">
			</div>
			<div class="gradient_border" id="password_confirm_input">
				<input type="submit" value="Valider" onclick="submit_new_password(event)">
			</div>
		</div>
		<script type="text/javascript">
			async function submit_new_password(event) {
				var password = document.querySelector('#password_input > input').value
				var confirm_password = document.querySelector('#password_confirm_input > input').value

				var error_element = document.getElementById('error')

				if (password == '' || confirm_password == '') {
					error_element.innerHTML = 'veuillez remplir tous les champs.'
					return
				}

				else if (password != confirm_password) {
					error_element.innerHTML = 'les deux mots de passe ne sont pas identiques.'
					return
				}

				var options = {
					method: 'POST',
					headers: {
						'Accept': "application/json",
						'Content-Type': 'application/json',
					},
					body: JSON.stringify({
						'new_password': password,
					}),
				}

				url = window.location.href
				url = url.replace('change_password_page', 'change_forgot_password')

				data_return = await fetch(url, options)
				.then(res => {
					if (!(res.ok)) {
						throw res.status
					}
					return res.json()
				})
				.then(data => {
					return(data)
				})
				.catch(status_error => {
					console.log(`error ${status_error}`)
				})

				if (data_return.status == 'ok')
				{
					console.log(data_return)

					set_access_token(data_return.access_token)
					set_refresh_token(data_return.refresh_token)

					window.location = `http://${window.location.hostname}:${window.location.port}/?page=account`
				} else {
					error_element.innerHTML = 'erreur inconnu veuillez contactez <a href="mailto: savonnerie.saon.sav@gmail.com">savonnerie.saon.sav@gmail.com</a>. merci'
				}
			}
		</script>
	</div>
</body>
</html>
