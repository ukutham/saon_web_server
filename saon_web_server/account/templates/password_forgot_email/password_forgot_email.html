{% load static %}

<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" type="text/css" href="{% static 'password_forgot_email/password_forgot_email.css' %}">
	<link rel="icon" type='image/png' href="{% static 'logo/logo_savon_v2.png' %}">
	<title>Saon</title>

	<meta name ="robots" content ="noindex, nofollow">
</head>
<body>
	<div id="accept_message">
		<div id='saon_icon'>
			<img src="{% static 'logo/logo_savon_v2.png' %}">
		</div>
		<div id='accept_message_message'>Un email vous a été envoyé pour modifier votre mot de passe.</div>
		<input id='accept_message_return' type="button" value="renvoyer un mail" onClick="window.location.reload(true)">

			document.querySelector('#return_to_home').href = `${window.location.origin}/?page=account`
		</script>
	</div>
