{% load static %}

<!DOCTYPE html>
<html>
<head>
	<style type="text/css">
		@font-face {
		    font-family: 'Montserrat';
		    src: url("{% static 'fonts/Montserrat/Montserrat-VariableFont_wght.ttf' %}");
		    font-weight: normal;
		    font-style: normal;
		}
	</style>
	
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" type="text/css" href="{% static 'validation_page/validation_page.css' %}">
	<link rel="icon" type='image/png' href="{% static 'logo/logo_savon_v2.png' %}">
	<title>Saon</title>

	<meta name ="robots" content ="noindex, nofollow">
</head>
<body>
	<div id="accept_message">
		<div id='saon_icon'>
			<img src="{% static 'logo/logo_savon_v2.png' %}">
		</div>
		<div id="accept_message_icon">
			<svg
			height='200'
			width='200'
			viewBox='40 20 600 600'
			>
				<path stroke-width='90' stroke-linecap='round' stroke-linejoin='round' stroke='#FFF' fill='none' d='M 150 350 L 300 500 L 500 150'></path>
			</svg>
		</div>
		<div id='accept_message_message'>Voici votre nouveau mot de passe : {{ new_password }}, nous vous conseillons de le changer.</div>
		<div id='accept_message_return'><a href="">retourner a la page de connection</a></div>
		<script type="text/javascript">
			document.querySelector('#accept_message_return > a').href = `${window.location.origin}/?page=account`
		</script>
	</div>
</body>
</html>
