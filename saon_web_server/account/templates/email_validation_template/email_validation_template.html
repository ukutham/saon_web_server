{% load static %}

<!DOCTYPE html>
<html lang="fr" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office" style="height: 100%;width: 100%;">
<head>
	<style type="text/css">
		@font-face {
		    font-family: 'Montserrat';
		    src: url("{% static 'fonts/Montserrat/Montserrat-VariableFont_wght.ttf' %}");
		    font-weight: normal;
		    font-style: normal;
		}
	</style>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="x-apple-disable-message-reformatting">
</head>
<body style="height: 100%;width: 100%;">
	<table id="accept_message" style="height: 100%;width: 100%;">
		<tr id='saon_icon' style="margin-top: 10px;height: 100px;width: 100px;position: absolute;top: 0;left: 50%;transform: translateX(-50%); text-align: center;">
			<img src="{{ host }}/static/logo/logo_savon_v2_low_version.jpg" alt="logo de SAON" style="height:100px; width: 100px;" />
		</tr>
		<tr id='accept_message_message' style="margin-top: 20px;font-size: 2em;margin-bottom: 10px;text-align: center;padding-inline: 20px;">
			Merci de vous etre inscrit sur SAON. Afin de verifier votre adresse mail, veuilliez 
			<a href="{{ hostname }}account/{{ url_activation_email }}" style="color: black; ">cliquer ici</a>.
		</tr>
	</table>
</body>
</html>
